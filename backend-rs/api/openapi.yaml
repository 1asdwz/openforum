      description: |
        需要登录。同一类型已存在且未驳回、且等级不高于现有等级时返回
        400「该类型认证已存在，如需重新提交请使用重试接口」。类型非法返回 400「未知认证类型: X」。
        提交后经结构校验、规则引擎与专业审核插件，可能直接 APPROVED、REJECTED，或转人工 PENDING。
      requestBody:
        required: true
        content:
          application/json:
