  # ---------- OAuth 2.0 ----------
  /oauth/authorize/info:
    get:
      operationId: oauthAuthorizeInfo
      tags:
        - OAuth
      summary: 授权页应用信息
      description: 公开接口。返回待授权应用的名称、描述、所有者、客户端类型与生效 scope，供同意页展示。
      security: []
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          schema:
            type: string
        - name: scope
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 应用信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /oauth/authorize:
    post:
      operationId: oauthAuthorize
      tags:
        - OAuth
      summary: 同意或拒绝授权
      description: |
        需要登录。校验 redirect_uri 必须与应用登记值完全一致；公共客户端必须提供 PKCE S256 code_challenge。
        返回 `redirectTo`，由浏览器跳回应用（成功带 `code` 与 `state`，拒绝带 `error=access_denied`）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, redirectUri, approve]
              properties:
                clientId:
                  type: string
                redirectUri:
                  type: string
                state:
                  type: string
                  maxLength: 512
                codeChallenge:
                  type: string
                codeChallengeMethod:
                  type: string
                  enum: [S256]
                scope:
                  type: string
                approve:
                  type: boolean
      responses:
        '200':
          description: 跳转地址
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /oauth/token:
    post:
      operationId: oauthToken
      tags:
        - OAuth
      summary: 换取 / 刷新访问令牌
      description: |
        `application/x-www-form-urlencoded`。支持 `authorization_code` 与 `refresh_token`。
        机密客户端通过 HTTP Basic 或表单 `client_id`/`client_secret` 认证；公共客户端必须携带 `code_verifier`。
        失败时按 RFC 6749 返回 `{error, error_description}`，成功响应带 `Cache-Control: no-store`。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, refresh_token]
                code:
                  type: string
                redirect_uri:
                  type: string
                client_id:
                  type: string
                client_secret:
                  type: string
                code_verifier:
                  type: string
                refresh_token:
                  type: string
      responses:
        '200':
          description: 令牌
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    example: 7200
                  refresh_token:
                    type: string
                  scope:
                    type: string
        '400':
          description: invalid_request / invalid_grant / unsupported_grant_type
        '401':
          description: invalid_client
  /oauth/userinfo:
    get:
      operationId: oauthUserinfo
      tags:
        - OAuth
      summary: 当前令牌对应的用户
      description: 直接返回用户信息（不使用统一信封），便于第三方客户端消费。
      responses:
        '200':
          description: 用户信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  sub:
                    type: string
                  preferred_username:
                    type: string
                  name:
                    type: string
                  picture:
                    type: string
                    nullable: true
                  role:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /oauth/revoke:
    post:
      operationId: oauthRevoke
      tags:
        - OAuth
      summary: 撤销 refresh token
      description: 需要客户端认证；仅撤销属于该客户端的 refresh token，始终返回 200。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
                client_id:
                  type: string
                client_secret:
                  type: string
      responses:
        '200':
          description: 已处理
        '401':
          description: invalid_client
  # ---------- 开发者应用 ----------
  /developers/apps:
    get:
      operationId: listDeveloperApps
      tags:
        - 开发者
      summary: 我的应用列表
      responses:
        '200':
          description: 应用列表与配额
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createDeveloperApp
      tags:
        - 开发者
      summary: 创建应用
      description: 每个用户最多 10 个应用；机密客户端返回的 `clientSecret` 只出现一次。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, redirectUris]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 80
                description:
                  type: string
                  maxLength: 500
                homepageUrl:
                  type: string
                redirectUris:
                  type: array
                  maxItems: 5
                  items:
                    type: string
                clientType:
                  type: string
                  enum: [CONFIDENTIAL, PUBLIC]
      responses:
        '200':
          description: 已创建的应用（含一次性 secret）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /developers/apps/{id}:
    get:
      operationId: getDeveloperApp
      tags:
        - 开发者
      summary: 应用详情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 应用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateDeveloperApp
      tags:
        - 开发者
      summary: 更新应用
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                homepageUrl:
                  type: string
                redirectUris:
                  type: array
                  items:
                    type: string
                status:
                  type: string
                  enum: [ACTIVE, DISABLED]
      responses:
        '200':
          description: 更新后的应用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteDeveloperApp
      tags:
        - 开发者
      summary: 删除应用及其令牌
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /developers/apps/{id}/secret:
    post:
      operationId: resetDeveloperAppSecret
      tags:
        - 开发者
      summary: 重置 client secret
      description: 仅机密客户端可用；旧 secret 立即失效，新 secret 只返回一次。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 含新 secret 的应用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /developers/docs:
    get:
      operationId: getOpenApiDocument
      tags:
        - 开发者
      summary: 下载 OpenAPI 文档
      security: []
      responses:
        '200':
          description: OpenAPI 3.0 YAML
          content:
            application/yaml:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 在 `Authorization` 头中携带 `Bearer <token>`，token 由注册/登录接口返回。
  responses:
    BadRequest:
      description: 请求参数错误（400）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 400
            message: 参数校验失败
            data: null
    Unauthorized:
      description: 未登录或凭证无效（401）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 401
            message: 请先登录
            data: null
    Forbidden:
      description: 无权限（403）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 403
            message: 需要坛主或管理员权限
            data: null
    NotFound:
      description: 资源不存在（404）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 404
            message: 资源不存在
            data: null
    InternalError:
      description: 服务器内部错误（500）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 500
            message: 服务器内部错误
            data: null
  schemas:
    # ---------- 通用信封 ----------
    ApiResponse:
      type: object
      description: 统一响应信封
      properties:
        code:
          type: integer
          format: int32
          description: 状态码（成功为 200，错误为 HTTP 状态码）
          example: 200
        message:
          type: string
          description: 提示信息（成功为 ok，错误为中文文案）
          example: ok
        data:
          nullable: true
          description: 业务数据，错误时为 null
    ApiResponseVoid:
      type: object
      description: 统一响应信封（data 恒为 null）
      properties:
        code:
          type: integer
          format: int32
          example: 200
        message:
          type: string
          example: ok
        data:
          nullable: true
          example: null
    # ---------- 枚举 ----------
    UserRole:
      type: string
      description: 用户角色
      enum: [USER, ADMIN]
    ForumRole:
      type: string
      description: 子论坛成员角色
      enum: [OWNER, MODERATOR, MEMBER]
    AuthType:
      type: string
      description: 认证类型
      enum: [REAL_NAME, ID_CARD, GENDER, AGE, NATIONALITY, DRIVER_LICENSE, MARRIAGE_CERT, PROPERTY_CERT, ASSETS, CUSTOM]
    AuthLevel:
      type: string
      description: 认证等级（LOW=低、MEDIUM=中、HIGH=高、EXTREME=极高）
      enum: [LOW, MEDIUM, HIGH, EXTREME]
    AuthStatus:
      type: string
      description: 认证状态
      enum: [PENDING, APPROVED, REJECTED]
    CustomPageStatus:
      type: string
      description: 自定义页状态
      enum: [DRAFT, PENDING, APPROVED, REJECTED]
    TemplateType:
      type: string
      description: 子论坛模板类型
      enum: [DEFAULT, CUSTOM]
    MediaKind:
      type: string
      description: 认证媒体类型
      enum: [DOCUMENT, SELFIE, VIDEO]
    ReviewMethod:
      type: string
      description: 审核方式（RULE=规则、AI=AI、MANUAL=人工、SYSTEM=系统）
      enum: [RULE, AI, MANUAL, SYSTEM]
    ReviewAction:
      type: string
      description: 审核动作
      enum: [SUBMIT, APPROVE, REJECT, RETRY]
    VoteTargetType:
      type: string
      description: 投票目标类型
      enum: [POST, COMMENT]
    PluginType:
      type: string
      description: 插件类型
      enum: [REVIEW, DOCUMENT_REVIEW, RECOMMENDATION, CONTENT_BLOCK]
    # ---------- 请求体 ----------
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          description: 用户名（3-50 位）
        email:
          type: string
          format: email
          description: 邮箱
        password:
          type: string
          description: 密码（6-64 位）
    LoginRequest:
      type: object
      required: [usernameOrEmail, password]
      properties:
        usernameOrEmail:
          type: string
          description: 用户名或邮箱
        password:
          type: string
          description: 密码
    GoogleLoginRequest:
      type: object
      required: [credential]
      properties:
        credential:
          type: string
          description: Google ID Token（credential）
    UpdateProfileRequest:
      type: object
      properties:
        avatar:
          type: string
          nullable: true
          description: 头像 URL
        bio:
          type: string
          nullable: true
          description: 个人简介
    ForumCreateRequest:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          description: 唯一标识，仅小写字母/数字/-/_，2-80 位
        name:
          type: string
          description: 名称
        description:
          type: string
          nullable: true
          description: 简介
        icon:
          type: string
          nullable: true
          description: 图标 URL
        themeColor:
          type: string
          nullable: true
          description: 主题色，缺省 #FF4500
        templateType:
          $ref: '#/components/schemas/TemplateType'
        templateConfig:
          type: string
          nullable: true
          description: 模板配置（JSON 字符串）
        rules:
          type: string
          nullable: true
          description: 版规
        requiredAuthTypes:
          type: array
          nullable: true
          description: |
            发帖所需认证门槛。元素可为 `TYPE`（如 REAL_NAME）、`TYPE:LEVEL`（如 REAL_NAME:HIGH）
            或 `AGE_n`（如 AGE_18）。
          items:
            type: string
    ForumUpdateRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        themeColor:
          type: string
          nullable: true
        templateType:
          $ref: '#/components/schemas/TemplateType'
        templateConfig:
          type: string
          nullable: true
        rules:
          type: string
          nullable: true
        requiredAuthTypes:
          type: array
          nullable: true
          items:
            type: string
    CustomPageUpdateRequest:
      type: object
      required: [html]
      properties:
        html:
          type: string
          description: 自定义页 HTML（会被安全过滤）
    PostCreateRequest:
      type: object
      required: [forumId, title, content]
      properties:
        forumId:
          type: integer
          format: int64
          description: 目标子论坛 ID
        title:
          type: string
          description: 标题（最长 300）
        content:
          type: string
          description: 正文
    PostUpdateRequest:
      type: object
      properties:
        title:
          type: string
          nullable: true
          description: 标题
        content:
          type: string
          nullable: true
          description: 正文
    CommentCreateRequest:
      type: object
      required: [postId, content]
      properties:
        postId:
          type: integer
          format: int64
          description: 帖子 ID
        content:
          type: string
          description: 评论内容
        parentId:
          type: integer
          format: int64
          nullable: true
          description: 父评论 ID（可选）
    VoteRequest:
      type: object
      required: [value]
      properties:
        value:
          type: integer
          format: int32
          description: 投票值：1 赞同、-1 反对、0 取消
          enum: [1, 0, -1]
    ReviewDecisionRequest:
      type: object
      properties:
        reason:
          type: string
          nullable: true
          description: 审核意见
    PluginToggleRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: 是否启用
    AuthenticationSubmitRequest:
      type: object
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/AuthType'
        level:
          $ref: '#/components/schemas/AuthLevel'
        data:
          type: object
          nullable: true
          additionalProperties: true
          description: 业务字段（键随类型不同，如 fullName/age/gender...）
        mediaIds:
          type: array
          nullable: true
          items:
            type: integer
            format: int64
          description: 已上传的材料媒体 ID 列表
        videoMediaId:
          type: integer
          format: int64
          nullable: true
          description: 视频认证媒体 ID（HIGH 及以上必填）
        challengeId:
          type: string
          nullable: true
          description: 活体检测挑战 ID（HIGH 及以上必填）
        liveness:
          type: object
          nullable: true
          additionalProperties: true
          description: 活体检测结果
        attestation:
          type: object
          nullable: true
          additionalProperties: true
          description: 防伪录制结果
    # ---------- 分页包装 ----------
    PageResponsePostSummaryDTO:
      type: object
      description: PostSummaryDTO 分页
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PostSummaryDTO'
        page:
          type: integer
          format: int32
          description: 当前页码（从 0 开始）
        size:
          type: integer
          format: int32
          description: 每页大小
        totalElements:
          type: integer
          format: int64
          description: 总记录数
        totalPages:
          type: integer
          format: int32
          description: 总页数
    PageResponseCommentDTO:
      type: object
      description: CommentDTO 分页
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/CommentDTO'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    PageResponseForumSummaryDTO:
      type: object
      description: ForumSummaryDTO 分页
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ForumSummaryDTO'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    PageResponseAuthenticationDTO:
      type: object
      description: AuthenticationDTO 分页
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AuthenticationDTO'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    PageResponseCustomPageDTO:
      type: object
      description: CustomPageDTO 分页
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/CustomPageDTO'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
