            default: 20
      responses:
        '200':
          description: 分页用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseUserDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /plugins:
    get:
      operationId: listPlugins
