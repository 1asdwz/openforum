openapi: 3.0.3
info:
  title: OpenForum API
  version: 1.0.0
  description: |
    OpenForum 论坛后端接口文档。

    本规范基于现有 Spring Boot(Java) 实现编写，用于后续以 Rust(Axum) 重写并逐一对照。
    所有业务接口均挂载在 servlet context-path `/api` 之下，因此 `servers` 使用 `{ url: "/api" }`，
    `paths` 中以 `/auth/login` 这类相对路径书写。

    ## 统一响应信封
    所有非二进制接口返回如下结构（`ApiResponse`）：

    ```json
    { "code": 200, "message": "ok", "data": { } }
    ```

    出错时结构相同，`code` 为 HTTP 状态码，`message` 为中文错误文案，`data` 为 `null`。

    ## 分页响应
    分页接口的 `data` 为 `PageResponse` 结构：
    `{ "content": [], "page": 0, "size": 20, "totalElements": 0, "totalPages": 0 }`。

    ## 鉴权
    使用 HS256 签名的 Bearer JWT。登录/注册接口返回 `token`，后续请求放入
    `Authorization: Bearer <token>` 请求头。`/admin/**` 与部分插件管理接口需要 `ADMIN` 角色。

    ## 时间格式
    时间字段为无时区的 `LocalDateTime`，JSON 形如 `"2026-10-08T12:34:56"`。
servers:
  - url: /api
    description: 直连后端（server.servlet.context-path = /api）
tags:
  - name: 认证
    description: 注册、登录（密码 / Google）、当前用户
  - name: 用户
    description: 用户资料、用户的帖子与评论
  - name: 子论坛
    description: 子论坛列表、创建、详情、成员、自定义页面
  - name: 帖子
    description: 帖子列表、发布、详情、编辑、删除、投票、置顶
  - name: 评论
    description: 评论树、发表、删除、投票
  - name: 媒体
    description: 帖子媒体上传与读取
  - name: 认证中心
    description: 多类型多等级的用户认证（材料上传、活体挑战、提交与重试）
  - name: 管理后台
    description: 认证审核、自定义页审核、用户管理（需要 ADMIN）
  - name: 插件
    description: 插件列表与启停
  - name: OAuth
    description: OAuth 2.0 授权码流程（PKCE）、令牌交换、用户信息与撤销
  - name: 开发者
    description: 第三方应用自助注册与凭据管理
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      operationId: register
      tags:
        - 认证
      summary: 注册新账号
      description: |
        以用户名 + 邮箱 + 密码注册。成功后直接返回 JWT 与用户信息。
        用户名重复返回 400「用户名已被占用」，邮箱重复返回 400「邮箱已被占用」。
        用户名长度需 3-50，密码长度需 6-64，邮箱需符合格式。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 注册成功，返回 token 与用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      operationId: login
      tags:
        - 认证
      summary: 账号密码登录
      description: |
        `usernameOrEmail` 同时匹配用户名或邮箱。账号或密码错误返回 401「账号或密码错误」；
        账号被禁用返回 403「账号已被禁用」。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/google:
    post:
      operationId: loginWithGoogle
      tags:
        - 认证
      summary: Google 登录
      description: |
        使用 Google ID Token（`credential`）登录。未配置 `openforum.google.client-id` 时返回
        400「Google 登录未配置」。凭证非法返回 401「Google 登录凭证无效」；
        邮箱未验证返回 400「Google 账号邮箱未验证」。首次登录会自动创建账号。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me:
    get:
      operationId: me
      tags:
        - 认证
      summary: 获取当前登录用户
      description: 返回当前 JWT 对应的用户信息（含邮箱与已通过的认证类型）。未登录返回 401「请先登录」。
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{id}:
    get:
      operationId: getUserProfile
      tags:
        - 用户
      summary: 获取用户公开资料
      description: 公开接口。公开资料中 `email` 为 null。用户不存在返回 404「用户不存在」。
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: 用户 ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 用户资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserDTO'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/me:
    put:
      operationId: updateMe
      tags:
        - 用户
      summary: 更新个人资料
      description: 仅更新传入的非 null 字段（`avatar`、`bio`）。需要登录。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{id}/posts:
    get:
      operationId: getUserPosts
      tags:
        - 用户
      summary: 获取某用户的帖子（分页）
      description: 公开接口。`sort` 支持 `new`、`top`、`hot`（其他值按 `hot` 处理）。
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: 用户 ID
          schema:
            type: integer
            format: int64
        - name: sort
          in: query
          required: false
          description: 排序方式
          schema:
            type: string
            default: new
            enum: [new, top, hot]
        - name: page
          in: query
          required: false
          description: 页码，从 0 开始
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          description: 每页大小
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        '200':
          description: 分页帖子摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponsePostSummaryDTO'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{id}/comments:
    get:
      operationId: getUserComments
      tags:
        - 用户
      summary: 获取某用户的评论（分页）
      description: 公开接口。返回扁平评论，每条带下属帖子标题 `postTitle`。
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: 用户 ID
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        '200':
          description: 分页评论
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseCommentDTO'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /forums:
    get:
      operationId: listForums
      tags:
        - 子论坛
      summary: 子论坛列表（分页）
      description: 公开接口。`q` 对 name 或 slug 做不区分大小写模糊匹配。`sort=new` 按创建时间倒序，其他值按推荐分数。
      security: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
        - name: sort
          in: query
          required: false
          description: 排序方式，`new` 或 `hot`（默认）
          schema:
            type: string
            default: hot
        - name: q
          in: query
          required: false
          description: 关键字（匹配 name 或 slug）
          schema:
            type: string
      responses:
        '200':
          description: 分页子论坛摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseForumSummaryDTO'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createForum
      tags:
        - 子论坛
      summary: 创建子论坛
      description: |
        需要登录。`slug` 只能包含小写字母、数字、`-`、`_`（2-80 位），冲突返回 400「slug 已存在」。
        `themeColor` 缺省为 `#FF4500`。创建者自动成为 OWNER 成员。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForumCreateRequest'
      responses:
        '200':
          description: 创建后的子论坛详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseForumDetailDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /forums/popular:
    get:
      operationId: popularForums
      tags:
        - 子论坛
      summary: 热门子论坛
      description: 公开接口。按成员数倒序、再按帖子数倒序取前 `limit` 个。
      security: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 10
      responses:
        '200':
          description: 子论坛摘要列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListForumSummaryDTO'
        '500':
          $ref: '#/components/responses/InternalError'
  /forums/recommended:
    get:
      operationId: recommendedForums
      tags:
        - 子论坛
      summary: 推荐子论坛
      description: 公开接口。按推荐插件分数排序，登录用户已加入的板块会被加权置前。
      security: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 10
      responses:
        '200':
          description: 子论坛摘要列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListForumSummaryDTO'
        '500':
          $ref: '#/components/responses/InternalError'
  /forums/{slug}:
    get:
      operationId: getForumDetail
      tags:
        - 子论坛
      summary: 子论坛详情（按 slug）
      description: 公开接口。仅当自定义页审核通过（APPROVED）时才在 `customPageHtml` 返回 HTML。不存在返回 404「子论坛不存在」。
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          description: 子论坛 slug
          schema:
            type: string
      responses:
        '200':
          description: 子论坛详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseForumDetailDTO'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /forums/{id}:
    put:
      operationId: updateForum
      tags:
        - 子论坛
      summary: 更新子论坛
      description: 需要登录且具备坛主（OWNER）或管理员（MODERATOR）权限，否则 403「需要坛主或管理员权限」。仅更新传入的非 null 字段。
      parameters:
        - name: id
          in: path
          required: true
          description: 子论坛 ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForumUpdateRequest'
      responses:
        '200':
          description: 更新后的子论坛详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseForumDetailDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /forums/{id}/custom-page:
    get:
      operationId: getCustomPage
      tags:
        - 子论坛
      summary: 读取子论坛自定义页面
      description: 需要登录且具备坛主或管理员权限，否则 403「需要坛主或管理员权限」，未登录 401「请先登录」。
      parameters:
        - name: id
          in: path
          required: true
          description: 子论坛 ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 自定义页面数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCustomPageDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: saveCustomPage
      tags:
        - 子论坛
      summary: 保存自定义页面 HTML（草稿）
      description: |
        需要登录且具备坛主或管理员权限。HTML 会先去危险标签/事件后再保存，状态置为 DRAFT，
        并清空审核备注。`html` 为空返回 400「html 不能为空」。
      parameters:
        - name: id
          in: path
          required: true
          description: 子论坛 ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomPageUpdateRequest'
      responses:
        '200':
          description: 保存后的自定义页面数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCustomPageDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /forums/{id}/custom-page/submit:
    post:
      operationId: submitCustomPage
      tags:
        - 子论坛
      summary: 提交自定义页面审核
      description: 需要登录且具备坛主或管理员权限。若尚未保存 HTML 返回 400「请先保存自定义页面 HTML」。状态置为 PENDING。
      parameters:
        - name: id
          in: path
          required: true
          description: 子论坛 ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 提交后的自定义页面数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCustomPageDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /forums/{id}/join:
    post:
      operationId: joinForum
      tags:
        - 子论坛
      summary: 加入子论坛
      description: 需要登录。重复加入为幂等操作。
      parameters:
        - name: id
          in: path
          required: true
          description: 子论坛 ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 成功（data 为 null）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /forums/{id}/leave:
    post:
      operationId: leaveForum
      tags:
        - 子论坛
      summary: 退出子论坛
      description: 需要登录。坛主不能退出自己的子论坛（400「坛主不能退出自己的子论坛」）。
      parameters:
        - name: id
          in: path
          required: true
          description: 子论坛 ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 成功（data 为 null）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /forums/{id}/members:
    get:
      operationId: listForumMembers
      tags:
        - 子论坛
      summary: 子论坛成员列表
      description: 公开接口。按加入时间升序返回。不存在返回 404「子论坛不存在」。
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: 子论坛 ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 成员列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListMemberDTO'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /posts:
    get:
      operationId: listPosts
      tags:
        - 帖子
      summary: 帖子列表（分页）
      description: |
        公开接口。`q` 非空时按标题模糊匹配（此时忽略 `forumId`）；否则按 `forumId` 过滤，
        未提供 `forumId` 时返回全部未删除帖子。`sort` 支持 `new`、`top`、`hot`；置顶帖始终排前。
      security: []
      parameters:
        - name: forumId
          in: query
          required: false
          description: 子论坛 ID
          schema:
            type: integer
            format: int64
        - name: q
          in: query
          required: false
          description: 标题关键字（不区分大小写）
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: 排序方式
          schema:
            type: string
            default: hot
            enum: [new, top, hot]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        '200':
          description: 分页帖子摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponsePostSummaryDTO'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createPost
      tags:
        - 帖子
      summary: 发布帖子
      description: |
        需要登录。目标子论坛需通过认证门槛（`requiredAuthTypes`），否则 403 并返回缺失项文案
        （如「需要完成认证: REAL_NAME, AGE_18」）。标题最长 300。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreateRequest'
      responses:
        '200':
          description: 发帖后的帖子详情
          content:
            application/json:
              schema:
