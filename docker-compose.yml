version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: openforum-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: openforum
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - openforum-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: openforum-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - openforum-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openforum-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/openforum
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123456
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - openforum-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: openforum-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - openforum-network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

networks:
  openforum-network:
    driver: bridge
