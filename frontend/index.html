<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff4500'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='Arial'%3EF%3C/text%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenForum - 开放式论坛系统</title>
    <!-- 提前建连，缩短 Google 登录脚本的跨洋 TLS 握手耗时 -->
    <link rel="preconnect" href="https://accounts.google.com" />
    <link rel="dns-prefetch" href="https://accounts.google.com" />
    <script>
      // 首屏前套用主题，避免深色模式下闪白（与 stores/ui.ts 保持一致）
      (function () {
        try {
          var t = localStorage.getItem('of-theme') || 'system';
          var dark =
            t === 'dark' ||
            (t === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
          }
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <!-- 全局加载 Google Identity Services，登录/注册页无需等待脚本再渲染按钮 -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      :root {
        --of-brand: #ff4500;
        --of-primary: #d93900;
        --of-bg: #f6f8f9;
        --of-card: #ffffff;
        --of-border: #e5ebee;
        --of-text: #181c1f;
        --of-text-body: #333d42;
        --of-nav-height: 56px;
        --of-rail-left: 270px;
        --of-rail-right: 316px;
        --of-radius: 16px;
        --of-max-width: 1460px;
        --sk-base: #e5ebee;
        --sk-hi: #f2f5f6;
      }
      html.dark {
        --of-bg: #0b1416;
        --of-card: #181c1f;
        --of-border: #2a3c42;
        --of-text: #eef1f3;
        --of-text-body: #d7dde0;
        --sk-base: #223237;
        --sk-hi: #2a3c42;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial,
          sans-serif;
        background-color: var(--of-bg);
        color: var(--of-text-body);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      #app {
        min-height: 100vh;
      }
      /* ---------- 首屏骨架屏（Vue 挂载后自动替换） ---------- */
      .of-sk-shimmer {
        background: linear-gradient(
          90deg,
          var(--sk-base) 25%,
          var(--sk-hi) 37%,
          var(--sk-base) 63%
        );
        background-size: 400% 100%;
        animation: of-sk-loading 1.4s ease infinite;
        border-radius: 8px;
      }
      @keyframes of-sk-loading {
        0% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0 50%;
        }
      }
      .of-sk-topnav {
        position: sticky;
        top: 0;
        z-index: 100;
        height: var(--of-nav-height);
        background: var(--of-card);
        border-bottom: 1px solid var(--of-border);
      }
      .of-sk-topnav-inner {
        max-width: var(--of-max-width);
        height: 100%;
        margin: 0 auto;
        padding: 0 24px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .of-sk-logo {
        width: 32px;
        height: 32px;
        border-radius: 9999px;
        background: var(--of-brand);
        flex-shrink: 0;
      }
      .of-sk-brand {
        width: 110px;
        height: 18px;
      }
      .of-sk-search {
        flex: 1;
        max-width: 560px;
        height: 40px;
        border-radius: 9999px;
      }
      .of-sk-actions {
        margin-left: auto;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .of-sk-pill {
        height: 32px;
        width: 96px;
        border-radius: 9999px;
      }
      .of-sk-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
      }
      .of-sk-main {
        max-width: var(--of-max-width);
        margin: 0 auto;
        padding: 20px 24px 64px;
      }
      .of-sk-layout {
        display: grid;
        grid-template-columns: var(--of-rail-left) minmax(0, 1fr) var(--of-rail-right);
        gap: 24px;
        align-items: start;
      }
      .of-sk-sidebar,
      .of-sk-aside {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .of-sk-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        background: var(--of-card);
        border: 1px solid var(--of-border);
        border-radius: var(--of-radius);
      }
      .of-sk-line {
        height: 12px;
      }
      .of-sk-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .of-sk-dot {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .of-sk-col {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .of-sk-title {
        width: 90px;
        height: 12px;
      }
      .of-sk-feed {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .of-sk-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 0 8px;
      }
      .of-sk-tabs {
        display: flex;
        gap: 8px;
      }
      .of-sk-tab {
        width: 64px;
        height: 28px;
        border-radius: 9999px;
      }
      .of-sk-post {
        display: flex;
        padding: 8px 8px 8px 0;
        background: var(--of-card);
        border: 1px solid var(--of-border);
        border-radius: var(--of-radius);
      }
      .of-sk-vote {
        width: 40px;
        flex-shrink: 0;
      }
      .of-sk-post-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 6px 12px 6px 0;
      }
      @media (max-width: 1280px) {
        .of-sk-layout {
          grid-template-columns: var(--of-rail-left) minmax(0, 1fr);
        }
        .of-sk-aside {
          display: none;
        }
      }
      @media (max-width: 960px) {
        .of-sk-layout {
          grid-template-columns: minmax(0, 1fr);
        }
        .of-sk-sidebar {
          display: none;
        }
      }
      @media (max-width: 640px) {
        .of-sk-brand,
        .of-sk-pill {
          display: none;
        }
        .of-sk-main {
          padding: 12px 8px 48px;
        }
        .of-sk-topnav-inner {
          padding: 8px 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div aria-busy="true" aria-label="加载中">
        <header class="of-sk-topnav">
          <div class="of-sk-topnav-inner">
            <div class="of-sk-logo"></div>
            <div class="of-sk-brand of-sk-shimmer"></div>
            <div class="of-sk-search of-sk-shimmer"></div>
            <div class="of-sk-actions">
              <div class="of-sk-pill of-sk-shimmer"></div>
              <div class="of-sk-avatar of-sk-shimmer"></div>
            </div>
          </div>
        </header>
        <main class="of-sk-main">
          <div class="of-sk-layout">
            <aside class="of-sk-sidebar">
              <div class="of-sk-group">
                <div class="of-sk-row">
                  <div class="of-sk-dot of-sk-shimmer"></div>
                  <div class="of-sk-line of-sk-shimmer" style="width: 60%"></div>
                </div>
                <div class="of-sk-row">
                  <div class="of-sk-dot of-sk-shimmer"></div>
                  <div class="of-sk-line of-sk-shimmer" style="width: 50%"></div>
                </div>
                <div class="of-sk-row">
                  <div class="of-sk-dot of-sk-shimmer"></div>
                  <div class="of-sk-line of-sk-shimmer" style="width: 66%"></div>
                </div>
              </div>
              <div class="of-sk-group">
                <div class="of-sk-title of-sk-shimmer"></div>
                <div class="of-sk-row">
                  <div class="of-sk-dot of-sk-shimmer"></div>
                  <div class="of-sk-col">
                    <div class="of-sk-line of-sk-shimmer" style="width: 70%"></div>
                    <div class="of-sk-line of-sk-shimmer" style="width: 45%"></div>
                  </div>
                </div>
                <div class="of-sk-row">
                  <div class="of-sk-dot of-sk-shimmer"></div>
                  <div class="of-sk-col">
                    <div class="of-sk-line of-sk-shimmer" style="width: 60%"></div>
                    <div class="of-sk-line of-sk-shimmer" style="width: 40%"></div>
                  </div>
                </div>
                <div class="of-sk-row">
                  <div class="of-sk-dot of-sk-shimmer"></div>
                  <div class="of-sk-col">
                    <div class="of-sk-line of-sk-shimmer" style="width: 75%"></div>
                    <div class="of-sk-line of-sk-shimmer" style="width: 50%"></div>
                  </div>
                </div>
              </div>
            </aside>

            <div class="of-sk-feed">
              <div class="of-sk-toolbar">
                <div class="of-sk-tabs">
                  <div class="of-sk-tab of-sk-shimmer"></div>
                  <div class="of-sk-tab of-sk-shimmer"></div>
                  <div class="of-sk-tab of-sk-shimmer"></div>
                </div>
                <div class="of-sk-pill of-sk-shimmer" style="width: 64px"></div>
              </div>
              <div class="of-sk-post">
                <div class="of-sk-vote"></div>
                <div class="of-sk-post-body">
                  <div class="of-sk-line of-sk-shimmer" style="width: 30%"></div>
                  <div class="of-sk-line of-sk-shimmer" style="width: 85%; height: 18px"></div>
                  <div class="of-sk-line of-sk-shimmer" style="width: 95%"></div>
                  <div class="of-sk-line of-sk-shimmer" style="width: 60%"></div>
                </div>
              </div>
              <div class="of-sk-post">
                <div class="of-sk-vote"></div>
                <div class="of-sk-post-body">
                  <div class="of-sk-line of-sk-shimmer" style="width: 35%"></div>
                  <div class="of-sk-line of-sk-shimmer" style="width: 78%; height: 18px"></div>
                  <div class="of-sk-line of-sk-shimmer" style="width: 92%"></div>
                  <div class="of-sk-line of-sk-shimmer" style="width: 55%"></div>
                </div>
              </div>
              <div class="of-sk-post">
                <div class="of-sk-vote"></div>
                <div class="of-sk-post-body">
                  <div class="of-sk-line of-sk-shimmer" style="width: 28%"></div>
                  <div class="of-sk-line of-sk-shimmer" style="width: 88%; height: 18px"></div>
                  <div class="of-sk-line of-sk-shimmer" style="width: 90%"></div>
                  <div class="of-sk-line of-sk-shimmer" style="width: 62%"></div>
                </div>
              </div>
            </div>

            <aside class="of-sk-aside">
              <div class="of-sk-group">
                <div class="of-sk-line of-sk-shimmer" style="width: 55%"></div>
                <div class="of-sk-line of-sk-shimmer" style="width: 90%"></div>
                <div class="of-sk-line of-sk-shimmer" style="width: 75%"></div>
                <div class="of-sk-pill of-sk-shimmer" style="width: 100%"></div>
              </div>
              <div class="of-sk-group">
                <div class="of-sk-title of-sk-shimmer"></div>
                <div class="of-sk-row">
                  <div class="of-sk-dot of-sk-shimmer"></div>
                  <div class="of-sk-col">
                    <div class="of-sk-line of-sk-shimmer" style="width: 65%"></div>
                    <div class="of-sk-line of-sk-shimmer" style="width: 42%"></div>
                  </div>
                </div>
                <div class="of-sk-row">
                  <div class="of-sk-dot of-sk-shimmer"></div>
                  <div class="of-sk-col">
                    <div class="of-sk-line of-sk-shimmer" style="width: 72%"></div>
                    <div class="of-sk-line of-sk-shimmer" style="width: 38%"></div>
                  </div>
                </div>
              </div>
            </aside>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
